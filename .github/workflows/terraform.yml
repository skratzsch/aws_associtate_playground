name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write  # Für PR Comments

jobs:
  # Job 1: Detect changed modules
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Für git diff

      - name: Detect changed modules
        id: set-modules
        run: |
          # Dependency-based apply order: networking → security → compute → storage → database
          APPLY_ORDER="terraform/01-networking terraform/02-security terraform/03-compute terraform/04-storage terraform/05-database"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Bei PR: Nur geänderte Module (in dependency order)
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            CHANGED_MODULES=$(echo "$CHANGED_FILES" | grep '^terraform/' | cut -d'/' -f1-2 | sort -u)
            if [ -z "$CHANGED_MODULES" ]; then
              echo "modules=[]" >> $GITHUB_OUTPUT
            else
              MODULES=$(echo "$CHANGED_MODULES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
              echo "modules=$MODULES" >> $GITHUB_OUTPUT
            fi
          else
            # Bei Push auf main: Alle Module in Dependency-Reihenfolge
            MODULES=$(echo "$APPLY_ORDER" | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "modules=$MODULES" >> $GITHUB_OUTPUT
          fi

  # Job 2: Terraform operations per module
  terraform:
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1  # Sequentiell wegen Dependencies
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    defaults:
      run:
        working-directory: ./${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891376982602:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -no-color
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const output = `#### Module: \`${{ matrix.module }}\`
            #### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN_OUTPUT}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve