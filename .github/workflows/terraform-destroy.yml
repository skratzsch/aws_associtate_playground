name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to destroy'
        required: true
        type: choice
        options:
          - all
          - 01-networking

permissions:
  id-token: write
  contents: read

jobs:
  # Job 1: Determine which modules to destroy
  prepare:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - name: Set modules to destroy
        id: set-modules
        run: |
          if [ "${{ github.event.inputs.module }}" == "all" ]; then
            # Reverse order for destroy (last created, first destroyed)
            echo 'modules=["03-storage","02-compute","01-networking"]' >> $GITHUB_OUTPUT
          else
            echo 'modules=["${{ github.event.inputs.module }}"]' >> $GITHUB_OUTPUT
          fi

  # Job 2: Destroy modules sequentially (wichtig für Dependencies!)
  destroy:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1  # Sequentiell, nicht parallel!
      matrix:
        module: ${{ fromJson(needs.prepare.outputs.modules) }}
    defaults:
      run:
        working-directory: ./terraform/${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891376982602:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        continue-on-error: false  # Stop bei Fehler
