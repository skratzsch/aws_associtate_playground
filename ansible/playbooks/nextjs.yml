---
- name: Deploy NextJS application
  hosts: all
  become: true

  vars:
    app_dir: /opt/on-the-run-web
    app_user: ubuntu

  tasks:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Install Node.js via NodeSource
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
        apt-get install -y nodejs
      args:
        creates: /usr/bin/node

    - name: Clone NextJS repository
      ansible.builtin.git:
        repo: "{{ nextjs_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      become_user: "{{ app_user }}"

    - name: Install dependencies
      ansible.builtin.command:
        cmd: npm ci
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Build NextJS application
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Deploy systemd service
      ansible.builtin.template:
        src: templates/nextjs.service.j2
        dest: /etc/systemd/system/nextjs.service
        mode: "0644"
      notify: Restart NextJS

    - name: Start and enable NextJS service
      ansible.builtin.systemd:
        name: nextjs
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart NextJS
      ansible.builtin.systemd:
        name: nextjs
        state: restarted
        daemon_reload: true
